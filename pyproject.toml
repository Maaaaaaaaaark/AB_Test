[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weval"
version = "0.1.0"
description = "Standalone frozen-model worker evaluation: evidence QA with abstention and mathematical reasoning checking. No training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tqdm>=4.64",
    "requests>=2.28",
    "huggingface_hub>=0.23",
    "datasets>=2.19",
    "sympy>=1.12",
    "safetensors>=0.4",
    "ujson>=5.8",
]

[project.optional-dependencies]
inference = ["torch>=2.3", "transformers>=4.51", "accelerate>=0.33"]
dev = ["pytest>=8.0"]

[project.scripts]
weval = "weval.cli:main"

[tool.setuptools.packages.find]
include = ["weval*"]
